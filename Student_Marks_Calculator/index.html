<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="style.css" rel="stylesheet" />
    <title>Student Marks Calculator</title>
  </head>
  <body>
    <div class="container">
      <h1>Student Marks Calculator</h1>

      <form class="form">
        <div class="form-group">
          <label for="subject1">
            English
            <input type="number" name="subject1" id="subject1" class="subjectInput" min="0" max="100"/>
          </label>
        </div>

        <div class="form-group">
          <label for="subject2">
            Mathematics
            <input type="number" name="subject2" id="subject2" class="subjectInput" min="0" max="100"/>
          </label>
        </div>

        <div class="form-group">
          <label for="subject3">
            Science
            <input type="number" name="subject3" id="subject3" class="subjectInput" min="0" max="100"/>
          </label>
        </div>

        <div class="form-group">
          <label for="subject4">
            Social Studies
            <input type="number" name="subject4" id="subject4" class="subjectInput" min="0" max="100"/>
          </label>
        </div>

        <div class="form-group">
          <label for="subject5">
            Hindi
            <input type="number" name="subject5" id="subject5" class="subjectInput" min="0" max="100" />
          </label>
        </div>

        <button type="submit" id="calculateBtn">Calculate</button>
      </form>
      <div class="result">
        <p id="percentage"></p>
        <p id="grade"></p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
