<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="style.css" rel="stylesheet" />
    <title>Weather App 2</title>
  </head>
  <body>
    <div class="weather-app">
      <!-- Heading -->
      <h1>Weather App</h1>

      <!-- Search Section -->
      <div class="search-section">
        <input type="text" id="placeInput" placeholder="Enter Place" />

        <button id="searchBtn">Search</button>
      </div>

      <!-- Weather Information -->
      <div class="weather-info">
        <!-- Place Name -->
        <h2 id="placeName"></h2>

        <!-- Weather Emoji -->
        <div id="weatherEmoji" class="weather-emoji"></div>

        <!-- Temperature -->
        <p id="temperature" class="temperature"></p>

        <!-- Weather Condition -->
        <p id="weatherCondition" class="weather-condition"></p>

        <!-- Humidity -->
        <p id="humidity"></p>

        <!-- Wind Speed -->
        <p id="windSpeed"></p>

        <!-- Current Date -->
        <p id="currentDate"></p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
